[package]
name = "warehouse-ledger"
version = "0.6.0"
description = "仓库出入库明细台账"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "warehouse_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
calamine = "0.27"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
if-addrs = "0.13"
log = "0.4"
mime_guess = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
