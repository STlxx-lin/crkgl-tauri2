[package]
name = "warehouse-ledger"
version = "0.10.0"
description = "仓库出入库明细台账"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "warehouse_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 单实例：Windows 用命名互斥量、Linux 用 D-Bus、macOS 用 Unix socket，
# 比按进程名扫描更准确，且第二个实例会把命令行参数转交给第一个实例后自行退出
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
calamine = "0.27"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
if-addrs = "0.13"
log = "0.4"
mime_guess = "2"

# 只有开机自启要碰注册表；用已在依赖图里的 0.59，不额外拉新版本
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
